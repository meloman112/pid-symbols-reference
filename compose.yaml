services:
  web:
    build: .
    command: ["python", "web.py", "8080"]
    ports: ["8080:8080"]
    volumes: ["./data:/app/data"]
    restart: unless-stopped

  mcp:
    build: .
    command: ["python", "mcp_server.py", "8081"]
    ports: ["8081:8081"]
    volumes: ["./data:/app/data"]
    restart: unless-stopped
