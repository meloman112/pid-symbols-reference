x-app: &app
  # network: host — на некоторых серверах у контейнеров сборки нет DNS, а у хоста есть
  build: {context: ., network: host}
  volumes: ["./data:/app/data"]
  restart: unless-stopped

services:
  web:
    <<: *app
    command: ["python", "web.py", "8080"]
    ports: ["8080:8080"]

  mcp:
    <<: *app
    command: ["python", "mcp_server.py", "8081"]
    ports: ["8081:8081"]
